{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Eliminar Estado - UTEPPI{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="panel-card">
                <div class="panel-header" style="color:#b91c1c;">Confirmar Eliminación</div>
                <div class="panel-body">
                    <p class="mb-1" style="font-size:.85rem;">¿Estás seguro de que deseas eliminar el tipo de estado?</p>
                    <p class="mb-3 d-flex align-items-center gap-2">
                        <strong>{{ object.nombre }}</strong>
                        <span style="width: 24px; height: 16px; border-radius: 4px; background-color: {{ object.color }}; border: 1px solid #e5e8ee; display: inline-block;"></span>
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger btn-sm">Sí, Eliminar</button>
                            <a href="{% url 'tipoestado_list' %}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
